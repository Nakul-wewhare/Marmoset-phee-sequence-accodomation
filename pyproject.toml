[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marmoset-convergence"
version = "0.2.0"
description = "Reproducible sequence- and call-structure analyses for marmoset vocal convergence"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.7,<4",
  "numpy>=1.23,<3",
  "pandas>=1.5,<3",
]

[project.optional-dependencies]
test = ["pytest>=7,<9"]

[project.scripts]
marmoset-repro = "marmoset_convergence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
