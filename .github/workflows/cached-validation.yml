name: cached validation

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lightweight test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Unit and notebook-hygiene tests
        run: pytest
      - name: Validate included caches and manuscript snapshots
        run: python scripts/validate_release.py --root .
      - name: Exercise safe default runner
        run: bash scripts/run_repro_pipeline.sh --mode cached

  r-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Parse all R sources without fitting
        shell: Rscript {0}
        run: |
          files <- c(list.files("R", pattern = "[.]R$", full.names = TRUE),
                     list.files("tests/testthat", pattern = "[.]R$", full.names = TRUE))
          invisible(lapply(files, parse))
          message("Parsed ", length(files), " R files; no model was fitted.")
